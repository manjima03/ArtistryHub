<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ArtistryHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* .main-content {
            padding: 6rem 0 2rem 0;
            min-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
        } */
        .login-container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 2rem;
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
        }
        .login-title {
            margin-bottom: 2rem;
            color: #2c3e50;
            font-weight: 600;
            position: relative;
            padding-bottom: 1rem;
            text-align: center;
        }
        .login-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background-color: rgb(67, 110, 51);
            border-radius: 3px;
        }
        .form-control {
            border: 2px solid #e9ecef;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .form-control:focus {
            border-color: rgb(67, 110, 51);
            box-shadow: 0 0 0 3px rgba(67, 110, 51, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 0.8rem;
            background-color: rgb(67, 110, 51);
            border: none;
            color: white;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }
        .btn-login:hover {
            background-color: rgb(57, 94, 43);
            transform: translateY(-2px);
        }
        .login-options {
            text-align: center;
            margin-top: 1.5rem;
        }
        .login-options a {
            color: rgb(67, 110, 51);
            text-decoration: none;
            font-weight: 500;
        }
        .login-options a:hover {
            text-decoration: underline;
        }
        .social-login {
            margin-top: 2rem;
            text-align: center;
        }
        .social-login p {
            color: #7f8c8d;
            margin-bottom: 1rem;
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }
        .social-icons a {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2c3e50;
            transition: all 0.3s ease;
        }
        .social-icons a:hover {
            background-color: rgb(67, 110, 51);
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <header>
        <div class="titlebar">
            <div class="fsticon" style="display: flex; gap: 10px; align-items: center;">
                <a href="index.html">
                    <div class="icon">
                        <i class="bi bi-house"></i>
                    </div>
                </a>
                <div class="search-container">
                    <i class="bi bi-search"></i>
                    <input type="text" placeholder="Search products...">
                </div>
            </div>
            <div class="title">
                <h1>ArtistryHub</h1>
            </div>
            <div class="lasticon" style="display: flex; gap: 10px;">
                <div class="icon">
                    <a href="signup.html">
                        <i class="bi bi-person"></i>
                    </a>
                </div>
                <a href="favourites.html">
                    <div class="icon">
                        <i class="bi bi-heart"></i>
                    </div>
                </a>
                <a href="cart.html">
                    <div class="icon">
                        <i class="bi bi-bag"></i>
                    </div>
                </a>
            </div>
        </div>
    </header>

    <div class="main-content">
        <div class="container">
            <div class="login-container">
                <h2 class="login-title">Welcome Back</h2>
                <form>
                    <div class="mb-3">
                        <input type="email" class="form-control" placeholder="Email Address" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-login">Login</button>
                </form>
                <div class="login-options">
                    <a href="#">Forgot Password?</a>
                    <p class="mt-3">Don't have an account? <a href="signup.html">Sign up</a></p>
                </div>
                <div class="social-login">
                    <p>Or login with</p>
                    <div class="social-icons">
                        <a href="#"><i class="bi bi-google"></i></a>
                        <a href="#"><i class="bi bi-facebook"></i></a>
                        <a href="#"><i class="bi bi-twitter"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="social-icons">
            <i class="bi bi-facebook"></i>
            <i class="bi bi-twitter"></i>
            <i class="bi bi-instagram"></i>
        </div>
        <div class="footer-links">
            <a href="aboutus.html">About Us</a>
            <a href="contactus.html">Contact Us</a>
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
            <a href="#">Return Policy</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
